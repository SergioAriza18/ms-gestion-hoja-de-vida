spring:
  datasource:
    url: jdbc:h2:mem:hoja_vida_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  cors:
    allowed-origins: http://localhost:4200
