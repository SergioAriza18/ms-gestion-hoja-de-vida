server:
  port: ${HOJA_VIDA_SERVER_PORT:8080}

spring:
  datasource:
    url: ${HOJA_VIDA_DB_URL}
    username: ${HOJA_VIDA_DB_USERNAME}
    password: ${HOJA_VIDA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  cors:
    allowed-origins: ${HOJA_VIDA_CORS_ALLOWED_ORIGINS:http://localhost:4200}
