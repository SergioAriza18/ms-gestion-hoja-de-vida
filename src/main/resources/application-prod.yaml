server:
  port: ${HOJA_VIDA_SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${HOJA_VIDA_DB_URL}
    username: ${HOJA_VIDA_DB_USERNAME}
    password: ${HOJA_VIDA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HOJA_VIDA_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${HOJA_VIDA_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${HOJA_VIDA_DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HOJA_VIDA_DB_VALIDATION_TIMEOUT:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  lifecycle:
    timeout-per-shutdown-phase: ${HOJA_VIDA_SHUTDOWN_TIMEOUT:30s}

app:
  cors:
    allowed-origins: ${HOJA_VIDA_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
