name: maestriacomputacion-hv

services:
  mysql:
    image: mysql:8.0.44
    container_name: maestriacomputacion-hv-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Debe definir MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Debe definir MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Debe definir MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Debe definir MYSQL_ROOT_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - maestriacomputacion
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  mysql_data:
    name: maestriacomputacion-hv-mysql-data

networks:
  maestriacomputacion:
    name: maestriacomputacion-hv-network
    driver: bridge
